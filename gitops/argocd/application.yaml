# Registered into the cluster once, by hand: `kubectl apply -f
# gitops/argocd/application.yaml`. Everything after that — including
# changes to this file itself — flows through git, not kubectl.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gkoufie1/eks-gitops-dr-drill.git
    targetRevision: main
    path: gitops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
