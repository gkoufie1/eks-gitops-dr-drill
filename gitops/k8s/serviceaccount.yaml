apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: apps
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::829241815848:role/eks-gitops-dr-drill-dev-app-db-access
# This SA exists only to carry the IRSA annotation above — the app never
# calls the Kubernetes API itself, so it gets no auto-mounted API token.
automountServiceAccountToken: false
