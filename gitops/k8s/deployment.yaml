# The real workload: a small FastAPI app (source in app/) that connects to
# Aurora via IRSA-issued IAM tokens - no password in a Secret. Built and
# pushed to ECR by .github/workflows/build-push-app.yml on every push to
# app/. This is the same Argo CD Application that deployed the nginxdemos
# placeholder earlier - swapping the image was the point of proving GitOps
# worked before Aurora existed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: apps
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      serviceAccountName: demo-app
      containers:
        # Known simplification, not an oversight: CI also tags every build
        # with its git SHA, but pinning this manifest to that SHA would
        # mean CI editing this file after each build (image automation -
        # Argo CD Image Updater, or a CI step that commits the new tag).
        # Out of scope for this phase; :latest plus ECR's own image
        # scanning is the deliberate tradeoff for now.
        - name: demo-app
          image: 829241815848.dkr.ecr.us-east-2.amazonaws.com/eks-gitops-dr-drill-dev-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: eks-gitops-dr-drill-dev-aurora.cluster-cju8cuwsal5p.us-east-2.rds.amazonaws.com
            - name: DB_NAME
              value: drdrill
            - name: DB_USER
              value: app_iam_user
            - name: AWS_REGION
              value: us-east-2
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
